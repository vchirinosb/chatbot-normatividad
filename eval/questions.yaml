# Banco de preguntas de referencia (tarea 6.1).
# category: reglamento | tupa | combinada | fuera_alcance | sin_respuesta
# sources: artículos (article) del Reglamento o códigos (code) del TUPA.
# expected_fee y expected_term se comprueban contra data/processed/tupa.json
# con: .venv/bin/python eval/check_questions.py
# subset: true marca las ~15 preguntas usadas en las iteraciones (6.2).
version: 1
questions:
  # --- Reglamento de Estudiantes ------------------------------------------
  - id: REG-01
    category: reglamento
    subset: true
    question: ¿Qué pasa si desapruebo la misma asignatura tres veces?
    expected_answer: >-
      Se le separa temporalmente por un año; al volver solo puede matricularse
      en esa asignatura y, si la desaprueba por cuarta vez, procede el retiro
      definitivo de la Escuela Profesional.
    sources: [{article: 83}]
  - id: REG-02
    category: reglamento
    subset: true
    question: ¿Con qué nota se aprueba una asignatura?
    expected_answer: >-
      Nota mínima de doce (12) tanto en el componente conceptual (teoría) como
      en el procedimental (práctica), más 100 % de asistencia a la actividad
      práctica; si una dimensión no se aprueba, no se aprueba la asignatura.
    sources: [{article: 82}]
  - id: REG-03
    subset: true
    category: reglamento
    question: ¿Cuántas evaluaciones parciales tiene cada asignatura?
    expected_answer: Tres (3) evaluaciones parciales.
    sources: [{article: 73}]
  - id: REG-04
    category: reglamento
    question: ¿Cuántas semanas dura un semestre académico?
    expected_answer: Dieciocho (18) semanas, divididas en tres fases de aprendizaje y evaluación.
    sources: [{article: 18}]
  - id: REG-05
    category: reglamento
    subset: true
    question: ¿Cuáles son las sanciones que se pueden aplicar a los estudiantes?
    expected_answer: >-
      Amonestación escrita, suspensión hasta por dos semestres académicos y
      separación definitiva previo proceso disciplinario; se registran en la
      ficha récord del estudiante.
    sources: [{article: 24}]
  - id: REG-06
    category: reglamento
    question: ¿Cuál es el canal oficial de comunicación entre la universidad y los estudiantes?
    expected_answer: >-
      El correo electrónico institucional; una disposición se entiende
      notificada al depositarse en ese correo.
    sources: [{article: 21}]
  - id: REG-07
    category: reglamento
    question: ¿Por cuántos semestres puedo reservar mi matrícula?
    expected_answer: Reserva automática hasta por cinco (05) semestres.
    sources: [{article: 28}]
  - id: REG-08
    category: reglamento
    question: ¿Puedo anular mi matrícula por tercera vez?
    expected_answer: >-
      No; es improcedente la anulación de matrícula por tercera vez o más. El
      trámite se inicia en la plataforma de matrícula.
    sources: [{article: 41}]
  - id: REG-09
    category: reglamento
    question: ¿Cuántas asignaturas puedo llevar en la nivelación académica?
    expected_answer: >-
      Como máximo dos (2), sin incompatibilidad horaria y con los
      prerrequisitos aprobados; la asistencia es obligatoria.
    sources: [{article: 47}]
  - id: REG-10
    category: reglamento
    subset: true
    question: ¿En qué casos puedo pedir un examen de suficiencia con jurado?
    expected_answer: >-
      Entre otros: asignaturas desaparecidas del plan sin equivalente, y una o
      dos asignaturas teóricas o teórico-prácticas que se adeuden para
      completar el plan de estudios.
    sources: [{article: 57}]
    note: Artículo con notas de modificación (has_changes).
  - id: REG-11
    category: reglamento
    question: ¿Qué sanción recibe un estudiante que comete una falta en una evaluación por primera vez?
    expected_answer: >-
      Suspensión por un año (dos semestres), previo procedimiento
      administrativo; además no puede recibir premios, becas, intercambio,
      cartas de recomendación ni ser representante estudiantil.
    sources: [{article: 86}]
  - id: REG-12
    category: reglamento
    question: ¿Quiénes pueden recibir el Premio Anual a la Excelencia Académica?
    expected_answer: >-
      Egresados de pregrado que ingresaron y culminaron en la misma Escuela
      Profesional y registran el rendimiento más alto; quienes pidieron
      convalidaciones o examen de suficiencia no acceden (salvo el Art. 57°
      literal g).
    sources: [{article: 97}]
  - id: REG-13
    category: reglamento
    question: ¿Qué beneficio recibe un ayudante de cátedra?
    expected_answer: >-
      Una rebaja del 50 % de las tasas educativas; la asignación es hasta por
      un año.
    sources: [{article: 101}]
  - id: REG-14
    category: reglamento
    question: ¿Mis estudios prescriben si me demoro en sacar el grado?
    expected_answer: >-
      No; los estudios concluidos no prescriben y el derecho a graduarse o
      titularse sigue vigente si se cumplen los requisitos de los reglamentos
      de grados y títulos.
    sources: [{article: 108}]
  - id: REG-15
    category: reglamento
    question: ¿La universidad tiene un seguro para los estudiantes?
    expected_answer: Sí, la Universidad contrata un seguro contra accidentes.
    sources: [{article: 114}]
  - id: REG-16
    category: reglamento
    question: ¿Se puede tomar alcohol dentro de la universidad fuera del horario de clases?
    expected_answer: >-
      No; está totalmente prohibido dentro de las instalaciones, en horario de
      estudio o fuera de él.
    sources: [{article: 123}]
  - id: REG-17
    category: reglamento
    subset: true
    question: En la modalidad semipresencial, ¿qué porcentaje de asignaturas me pueden exonerar?
    expected_answer: >-
      Hasta un máximo del 20 % de las asignaturas del plan, del Área de
      Formación Profesional.
    sources: [{article: 136}]
  - id: REG-18
    category: reglamento
    question: ¿Cuántos créditos tiene como mínimo el plan de estudios semipresencial?
    expected_answer: 200 créditos académicos como mínimo.
    sources: [{article: 130}]

