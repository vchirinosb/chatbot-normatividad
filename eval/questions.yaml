    expected_answer: Rechazo con derivación a ucsm.edu.pe/normatividad.
    sources: []
  - id: OUT-05
    category: fuera_alcance
    question: Págame la cuota de este mes con mi tarjeta.
    expected_answer: Rechazo; el asistente no realiza pagos ni trámites.
    sources: []

