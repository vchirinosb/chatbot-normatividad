  - id: TUPA-09
    category: tupa
    question: ¿Cuánto cuesta la constancia de no adeudo?
    sources: [{code: SE113073D224}]
    expected_fee: S/ 11.00
    expected_term: 2 días hábiles
  - id: TUPA-10
    category: tupa
    question: ¿Cuánto demora la autorización de matrícula extemporánea?
    sources: [{code: PA113073291A}]
    expected_fee: Gratuito
    expected_term: 4 días hábiles
  - id: TUPA-11
    subset: true
    category: tupa
    question: ¿Cuánto cuesta matricularme en un curso de otra Escuela Profesional?
    sources: [{code: PA113073A4C4}]
    expected_fee: S/ 35.00
    expected_term: 1 día hábil
  - id: TUPA-12
    category: tupa
    question: ¿Cuánto cuesta el levantamiento de prerrequisitos?
    sources: [{code: PA1130737252}]
    expected_fee: S/ 30.00
    expected_term: 1 día hábil
  - id: TUPA-13
    category: tupa
    question: ¿Cuánto cuesta el título de segunda especialidad?
    sources: [{code: PA1130732473}]
    expected_fee: S/ 2750.00
    expected_term: 30 días hábiles

  # --- Combinadas (Reglamento + TUPA) ------------------------------------
  - id: COMB-01
    category: combinada
    subset: true
    question: Falté a un examen por enfermedad, ¿qué dice el reglamento y qué trámite hago en pregrado?
    expected_answer: >-
      Justificar ante el Decano dentro de los 5 días hábiles siguientes por el
      UCSM-ERP con certificado médico visado; el trámite de la Escuela
      Profesional es gratuito y se atiende en 5 días hábiles.
    sources: [{article: 74}, {code: PA1130732571}]
    expected_fee: Gratuito
    expected_term: 5 días hábiles
  - id: COMB-02
    category: combinada
    subset: true
    question: Quiero cambiarme de sección, ¿puedo hacerlo y cuánto cuesta?
    expected_answer: >-
      Sí, la rectificación de matrícula permite cambio de sección dentro del
      cronograma, en la plataforma de matrícula; cuesta S/ 13.00 y se atiende
      en 1 día hábil.
    sources: [{article: 40}, {code: PA113073BF13}]
    expected_fee: S/ 13.00
    expected_term: 1 día hábil
  - id: COMB-03
    category: combinada
    question: ¿Cuándo procede la anulación de matrícula y cuánto demora el trámite?
    expected_answer: >-
      Se inicia en la plataforma de matrícula dentro del plazo del semestre y
      no procede por tercera vez; el trámite es gratuito y demora 30 días
      hábiles.
    sources: [{article: 41}, {code: PA113073C401}]
    expected_fee: Gratuito
    expected_term: 30 días hábiles
  - id: COMB-04
    category: combinada
    question: ¿En qué casos puedo pedir examen de suficiencia y cuánto demora la solicitud?
    expected_answer: >-
      En los casos del Art. 57° (asignaturas desaparecidas o una o dos
      adeudadas para completar el plan); la solicitud es gratuita y se
      atiende en 15 días hábiles.
    sources: [{article: 57}, {code: PA1130735C82}]
    expected_fee: Gratuito
    expected_term: 15 días hábiles

