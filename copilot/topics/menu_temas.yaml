kind: AdaptiveDialog
modelDisplayName: Menú de temas
modelDescription: 'Muestra el menú de temas cuando el usuario pide ayuda, pregunta qué puede hacer el asistente o pide ver los temas disponibles. No lo uses cuando el usuario dice que quiere hacer o consultar un trámite: para eso está Consulta de trámite.'
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: SendActivity
      id: sendMessage_menu
      activity:
        text:
          - 'Estos son los temas que puedo ayudarte a consultar:'
        quickReplies:
          - kind: MessageBack
            text: Matrícula y convalidaciones
          - kind: MessageBack
            text: Evaluación y notas
          - kind: MessageBack
            text: Deberes, derechos y sanciones
          - kind: MessageBack
            text: Becas y bienestar
          - kind: MessageBack
            text: Grados, títulos y certificados
          - kind: MessageBack
            text: Modalidades semipresencial y a distancia
          - kind: MessageBack
            text: Trámites (requisitos, costos y plazos)
    - kind: CancelAllDialogs
      id: cancelAllDialogs_fin
